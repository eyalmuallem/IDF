<!doctype html>

<html lang="he" dir="rtl">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Master Control</title>

<script src="master-control-config.js"></script>

<style>

body {
  margin: 0;
  min-height: 100vh;

  display: grid;
  place-items: center;

  background: #07111f;

  color: white;

  font-family: Arial, sans-serif;
}

.box {
  text-align: center;
}

</style>

</head>

<body>

<div class="box">

<h2>
פותח Master Control...
</h2>

<p>
מעביר אותך לאזור הניהול המאובטח
</p>

</div>


<script>

const endpoint =
  String(
    window.DIGICARE_MASTER_CONTROL_URL || ''
  ).trim();

if (endpoint) {

  window.location.replace(
    endpoint +
    '?action=admin'
  );

} else {

  document.body.innerHTML =
    '<h2>Master Control לא הוגדר</h2>';

}

</script>

</body>

</html>
